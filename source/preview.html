 async function loadOutfit(id){
  if(outfitPacks.has(id))return outfitPacks.get(id);
  const loading=(async()=>{
   const source=new Image();source.src=OUTFIT_ATLASES[id];await source.decode();
   const atlas=document.createElement('canvas');atlas.width=1536;atlas.height=1024;atlas.getContext('2d').drawImage(source,0,0,1536,1024);
   async function crop(x,y,w,h){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(atlas,x,y,w,h,0,0,w,h);const img=new Image();img.src=c.toDataURL('image/png');await img.decode();return img;}
   return {sheet:atlas,cleanBody:await crop(512,0,512,512),restBody:await crop(1024,0,512,512)};
  })();
  outfitPacks.set(id,loading);
  try{return await loading;}catch(e){outfitPacks.delete(id);throw e;}
 }
 async function selectOutfit(id,persist=true){
  if(!['original','camel','monochrome'].includes(id))return;
  const request=++outfitRequest;outfitSelect.disabled=true;
  try{
   const pack=id==='original'?originalOutfit:await loadOutfit(id);
   if(request!==outfitRequest)return;
   sheet=pack.sheet;cleanBody=pack.cleanBody;restBody=pack.restBody;
   currentOutfit=id;armTextures=null;resetRig();outfitSelect.value=id;
   status.textContent='已换上'+outfitNames[id];schedule();
   if(persist){try{localStorage.setItem('anan-pet-outfit',id);}catch(e){}globalThis.openai?.setWidgetState?.({modelContent:{outfit:id},privateContent:null})?.catch(()=>{});}
  }catch(e){status.textContent='换装素材加载失败，请重试';outfitSelect.value=currentOutfit;}
  finally{if(request===outfitRequest)outfitSelect.disabled=false;}
 }
 outfitSelect.addEventListener('change',()=>selectOutfit(outfitSelect.value));
 let savedOutfit=globalThis.openai?.widgetState?.modelContent?.outfit;
 try{savedOutfit=savedOutfit||localStorage.getItem('anan-pet-outfit');}catch(e){}
 if(['camel','monochrome'].includes(savedOutfit))selectOutfit(savedOutfit,false);

 const poseScale=1.125,poseX=9.75,poseY=75;
 function poseRect(id){return{x:(id%3)*512,y:Math.floor(id/3)*512};}
 function paintPose(id,sy,sh,dx=0,dy=0){const p=poseRect(id);ctx.drawImage(sheet,p.x,p.y+sy,512,sh,poseX+dx,poseY+sy*poseScale+dy,512*poseScale,sh*poseScale);}
 function poseFrame(index){
  if(resting&&restBody.complete&&restBody.naturalWidth){ctx.drawImage(restBody,poseX+(currentOutfit==='original'?16:0)*poseScale,poseY,512*poseScale,512*poseScale);paintRestMarks();return;}
  // Full painted poses preserve the approved elbows and knit folds.
  // No cloth mesh, stretched sleeves, or detached wrist overlays.
  const body=inputMode==='mouse'?3:index;
  const expression=resting?5:petAmount>.04?5:angerMix>.15?4:0;
  const restAngle=resting?(reduced?.035:.035+Math.sin(performance.now()/1800)*.012):0;
  ctx.save();ctx.translate(313.5,378+petBob);ctx.rotate(petAngle+restAngle);ctx.translate(-313.5,-378);
  paintPose(currentOutfit==='monochrome'&&expression===4?0:expression,0,270);
  if(resting&&sleepHead.complete&&sleepHead.naturalWidth){
   ctx.save();ctx.beginPath();ctx.ellipse(poseX+270*poseScale,poseY+208*poseScale,108*poseScale,63*poseScale,0,0,Math.PI*2);ctx.clip();
   ctx.drawImage(sleepHead,poseX,poseY,512*poseScale,270*poseScale);ctx.restore();
  }
  if(expression===4&&angryHead.complete&&angryHead.naturalWidth){
   // Replace only the face interior; retain the approved hair and alpha outline.
   ctx.save();ctx.beginPath();ctx.ellipse(poseX+270*poseScale,poseY+208*poseScale,108*poseScale,63*poseScale,0,0,Math.PI*2);ctx.clip();
   ctx.beginPath();if(currentOutfit==='monochrome'){ctx.ellipse(poseX+270*poseScale,poseY+215*poseScale,88*poseScale,49*poseScale,0,0,Math.PI*2);ctx.clip();ctx.beginPath();ctx.rect(poseX+175*poseScale,poseY+174*poseScale,190*poseScale,90*poseScale);}else ctx.rect(poseX,poseY,512*poseScale,258*poseScale);ctx.clip();ctx.drawImage(angryHead,poseX,poseY,512*poseScale,270*poseScale);ctx.restore();
  }
  ctx.restore();
  if(inputMode==='mouse')paintMouseBody();else paintKeyBody();
  paintRestMarks();
  if(expression===4){
   const pulse=reduced?1:1+.075*Math.sin(performance.now()/130);
   ctx.save();ctx.globalAlpha=angerMix;ctx.translate(444,223);ctx.scale(pulse,pulse);ctx.font='32px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💢',0,0);ctx.restore();
  }
 }
 function mouseBodyPoint(x,y){
  // Anchor the shoulder, scarf and torso. Only the mouse-side forearm follows input.
  const influence=smooth(330,440,y)*(1-smooth(135,185,x));
  return{x:poseX+x*poseScale+(-28+(reduced?0:mouseDrawX*1.1))*influence,y:poseY+y*poseScale+(reduced?0:mouseDrawY*1.1*influence)};
 }
 function paintMouseBody(){
  // The keyboard occludes the torso hem; the resting right hand remains in front.
  ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);
  const hemY=(board.y-poseY)/poseScale;
  ctx.moveTo(poseX+160*poseScale,board.y);
  ctx.lineTo(poseX+305*poseScale,board.y);
  ctx.lineTo(poseX+284*poseScale,poseY+(hemY+19)*poseScale);
  ctx.lineTo(poseX+284*poseScale,H);ctx.lineTo(poseX+160*poseScale,H);ctx.closePath();
  ctx.clip('evenodd');
  const step=16;
  for(let y=258;y<512;y+=step)for(let x=0;x<512;x+=step){
   const x1=Math.min(512,x+step),y1=Math.min(512,y+step);
   const s=[{x,y:y+512},{x:x1,y:y+512},{x:x1,y:y1+512},{x,y:y1+512}];
   const d=[[x,y],[x1,y],[x1,y1],[x,y1]].map(([X,Y])=>mouseBodyPoint(X,Y));
   drawSkinTriangle([s[0],s[1],s[2]],[d[0],d[1],d[2]]);
   drawSkinTriangle([s[0],s[2],s[3]],[d[0],d[2],d[3]]);
  }
  ctx.restore();
 }
 function poseMouse(){
  const x=48+(inputMode==='mouse'&&!reduced?mouseDrawX*1.1:0),y=580+(inputMode==='mouse'&&!reduced?mouseDrawY*1.1:0);
  rr(x,y+4,64,48,21,'#cda18b','#ab7c67');rr(x,y,64,48,21,'#f8e7ce','#ab7c67');
  ctx.beginPath();ctx.moveTo(x+32,y+8);ctx.lineTo(x+32,y+36);ctx.strokeStyle='#bc8e78';ctx.stroke();rr(x+28,y+9,8,14,4,'#e9b5ab','#ab7c67');
 }

 const REST_DELAY=30000;
 let lastActivity=performance.now(),resting=false,restTimer=0;
 function armRestTimer(){
  clearTimeout(restTimer);
  restTimer=setTimeout(()=>{schedule();},Math.max(1,REST_DELAY-(performance.now()-lastActivity)));
 }
 function wakePet(){
  lastActivity=performance.now();resting=false;armRestTimer();schedule();
 }
 function updateRest(t){
  const next=t-lastActivity>=REST_DELAY&&!headHovered;
  if(next!==resting){resting=next;if(next){resetRig();status.textContent='休息一下，等你回来…';}}
 }
 function paintRestMarks(){
  if(!resting)return;
  const phase=performance.now()/1000;
  ctx.save();ctx.fillStyle='#725078';ctx.strokeStyle='#fff4e7';ctx.lineWidth=4;ctx.lineJoin='round';ctx.textAlign='center';ctx.textBaseline='middle';
  for(let i=0;i<3;i++){
   const bob=reduced?0:Math.sin(phase*1.5-i*.7)*5;
   ctx.globalAlpha=.95;
   ctx.font='600 '+(34+i*9)+'px ui-rounded,system-ui,sans-serif';
   const x=451+i*30,y=183-i*34+bob;
   ctx.strokeText(i===2?'Z':'z',x,y);ctx.fillText(i===2?'Z':'z',x,y);
  }
  ctx.restore();
 }
 root.querySelector('#tg-rest-demo').addEventListener('click',()=>{
  demoTimers.forEach(clearTimeout);demoTimers=[];headHovered=false;petAmount=0;
  angerUntil=0;lastActivity=performance.now()-REST_DELAY;clearTimeout(restTimer);schedule();
 });
 armRestTimer();

 function frame(index){poseFrame(index);}
 function render(t){
  raf=0;if(!ready)return;updateRest(t);ctx.clearRect(0,0,W,H);
  angerMix=t<angerUntil?Math.max(0,Math.min(1,(t-angerStarted)/180,(angerUntil-t)/700)):0;
  const nextMood=angerMix>0?(t>angerUntil-700?'cooling':'angry'):'normal';
  if(nextMood!==mood){mood=nextMood;status.textContent=mood==='angry'?'气鼓鼓：怎么还在打字呀！':mood==='cooling'?'慢慢消气…':'消气啦，继续陪你';if(mood==='normal')recent=[];}
  if(headHovered)status.textContent='眯眼晃晃脑袋，好舒服～';
  const typing=stepExactKeys(t),index=0;
  const moving=inputMode==='mouse'&&t-lastMouse<220;
  const mouseDt=mouseFrameTime?Math.min(40,Math.max(0,t-mouseFrameTime)):16;
  mouseFrameTime=t;
  const follow=1-Math.exp(-mouseDt/180);
  const petTarget=headHovered?1:0;
  petAmount+=(petTarget-petAmount)*(1-Math.exp(-mouseDt/240));
  const petPhase=(t-petStarted)/1000;
  petAngle=reduced?0:Math.sin(petPhase*2.5)*.035*petAmount;
  petBob=reduced?0:(Math.cos(petPhase*5)-1)*1.1*petAmount;
  const petSettling=headHovered||Math.abs(petTarget-petAmount)>.005;
  mouseDrawX+=(mouseX-mouseDrawX)*follow;mouseDrawY+=(mouseY-mouseDrawY)*follow;
  const mouseSettling=inputMode==='mouse'&&(Math.abs(mouseX-mouseDrawX)>.03||Math.abs(mouseY-mouseDrawY)>.03);
  mousePose=0;
  // Torso and sleeves belong behind the keyboard.
  // Complete character is painted once above the keyboard.
  poseMouse();
  rr(board.x,board.y+5,board.w,board.h,16,'#caa386','#a67f65');
  rr(board.x,board.y,board.w,board.h-5,16,'#f0d9bb','#b48a70');
  ctx.save();ctx.translate(board.x+board.w/2,board.y+board.h/2);ctx.rotate(Math.PI);ctx.translate(-board.x-board.w/2,-board.y-board.h/2);
  keys.forEach(k=>{const lit=(active.get(k.code)||0)>t;
   rr(k.x,k.y+3,k.w,k.h,5,lit?'#c67070':'#c6a98b');
   rr(k.x,k.y,k.w,k.h,5,lit?'#ecaaa4':(k.label.length>1?'#ead0bd':'#fff2dc'),'#c4a68b');
   ctx.fillStyle=lit?'#612c32':'#684b3c';ctx.font=(k.label.length>2?'10':'14')+'px ui-rounded,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(k.label,k.x+k.w/2,k.y+k.h/2+1);
  });
  ctx.restore();
  frame(index);
  pops=pops.filter(p=>t-p.start<1000);
  pops.forEach(p=>{const age=(t-p.start)/1000,up=reduced?0:62*(1-Math.pow(1-age,3));const x=p.x+(reduced?0:p.drift*age),y=64-up;ctx.save();ctx.globalAlpha=age<.6?1:(1-age)/.4;const scale=reduced?1:Math.min(1,age*12)* (1+.12*Math.sin(age*Math.PI));ctx.translate(x,y+22);ctx.scale(scale,scale);rr(-25,-22,50,44,13,'#ffe7e1','#b98479');ctx.fillStyle='#6c403d';ctx.font='500 '+(p.label.length>2?'16':'26')+'px ui-rounded,system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.label,0,1);ctx.restore();});
  for(const [code,until] of active)if(until<t)active.delete(code);
  petMarks=petMarks.filter(mark=>t-mark.t<500);
  if(!reduced)petMarks.forEach(mark=>{const age=(t-mark.t)/500;ctx.save();ctx.globalAlpha=(1-age)*.24;ctx.strokeStyle='#d59b92';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(mark.x,mark.y,12+age*9,5+age*4,-.25,0,Math.PI*2);ctx.stroke();ctx.restore();});
  if((resting&&!reduced)||pops.length||active.size||typing||t<angerUntil||moving||mouseSettling||petSettling||petMarks.length)raf=requestAnimationFrame(render);
 }
 function schedule(){if(!raf)raf=requestAnimationFrame(render);}
 function isOverHead(x,y){return ((x-313.5)/205)**2+((y-270)/180)**2<=1;}
function setHeadHover(value){if(headHovered===value)return;headHovered=value;if(value)petStarted=performance.now();if(!value){petPointer=null;}status.textContent=value?'眯眼晃晃脑袋，好舒服～':performance.now()<angerUntil?'气鼓鼓：怎么还在打字呀！':inputMode==='mouse'?'正在使用鼠标':'等待按键';schedule();}
 canvas.addEventListener('pointermove',e=>{wakePet();const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;setHeadHover(isOverHead(x,y));if(headHovered){const now=performance.now();if(petPointer){const dx=x-petPointer.x,dy=y-petPointer.y;if(Math.hypot(dx,dy)>1.5){petLastStroke=now;if(!petMarks.length||now-petMarks[petMarks.length-1].t>70){petMarks.push({x,y,t:now});if(petMarks.length>6)petMarks.shift();}}}petPointer={x,y};schedule();}});
 canvas.addEventListener('pointerleave',()=>setHeadHover(false));
 canvas.addEventListener('pointercancel',()=>setHeadHover(false));
 function moveMouse(dx,dy){if(!dx&&!dy)return;if(performance.now()-lastPress<200)return;resetRig();wakePet();inputMode='mouse';lastMouse=performance.now();mouseX=Math.max(-14,Math.min(14,mouseX+dx*.14));mouseY=Math.max(-6,Math.min(6,mouseY+dy*.07));status.textContent=lastMouse<angerUntil?'气鼓鼓地握着鼠标':'正在使用鼠标';schedule();}
 mouseZone.addEventListener('pointermove',e=>{if(previousPointer)moveMouse(e.clientX-previousPointer.x,e.clientY-previousPointer.y);previousPointer={x:e.clientX,y:e.clientY};});
 mouseZone.addEventListener('pointerleave',()=>{previousPointer=null;});
 mouseDemo.addEventListener('click',()=>{demoTimers.forEach(clearTimeout);demoTimers=[];mouseX=0;mouseY=0;for(let i=0;i<48;i++)demoTimers.push(setTimeout(()=>moveMouse(Math.cos(i*.13)*12,Math.sin(i*.13)*5),i*90));});
function press(code,label){const key=keys.find(k=>k.code===code);if(!key)return;const t=performance.now();wakePet();inputMode='keyboard';const hitX=2*board.x+board.w-key.x-key.w/2;hand=hitX<board.x+board.w/2?0:1;lastPress=t;recent=recent.filter(time=>t-time<=5000);recent.push(t);if(t<angerUntil||recent.length>=10){if(t>=angerUntil)angerStarted=t;angerUntil=t+3700;}queueExactKey(key,label);status.textContent=t<angerUntil?'气鼓鼓：怎么还在打字呀！':(label||key.label||'空格')+' · 对应键亮起';schedule();}
 input.addEventListener('keydown',e=>{if(e.isComposing||e.ctrlKey||e.metaKey||e.altKey)return;if(e.code==='Tab')return;const key=keys.find(k=>k.code===e.code);if(!key)return;e.preventDefault();if(e.repeat)return;press(e.code,/^Key/.test(e.code)?e.code.slice(3):key.label||'空格');});
 input.addEventListener('input',()=>{input.value='';});
 function play(){demoTimers.forEach(clearTimeout);demoTimers=[];Array.from('HELLO').forEach((letter,i)=>demoTimers.push(setTimeout(()=>press('Key'+letter,letter),i*240)));}
 demo.addEventListener('click',play);
 angryDemo.addEventListener('click',()=>{demoTimers.forEach(clearTimeout);demoTimers=[];recent=[];angerUntil=0;Array.from('HELLOHELLOHELLOHELLOHELLO').forEach((letter,i)=>demoTimers.push(setTimeout(()=>press('Key'+letter,letter),i*115)));});
 canvas.addEventListener('pointerdown',e=>{const rect=canvas.getBoundingClientRect(),x=2*board.x+board.w-(e.clientX-rect.left)*W/rect.width,y=2*board.y+board.h-(e.clientY-rect.top)*H/rect.height;const k=keys.find(k=>x>=k.x&&x<=k.x+k.w&&y>=k.y&&y<=k.y+k.h);if(k)press(k.code,k.label||'空格');});
 sheet.onload=()=>{ready=true;schedule();};
 sheet.onerror=()=>{status.textContent='角色素材加载失败';};
 if(sheet.complete&&sheet.naturalWidth){ready=true;schedule();}
})();
